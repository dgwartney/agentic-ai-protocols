<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .box { rx: 6; ry: 6; }
      .title { font-weight: bold; font-size: 13px; }
      .subtitle { font-size: 12px; fill: #555; }
      .item { font-size: 12px; fill: #333; }
      .arrow-label { font-size: 11px; fill: #333; }
    </style>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Left: Agent (backend) -->
  <rect class="box" x="20" y="20" width="300" height="240" fill="#f0f4ff" stroke="#333" stroke-width="1.5"/>
  <text class="title" x="170" y="42" text-anchor="middle">Agent (backend)</text>
  <text class="subtitle" x="170" y="60" text-anchor="middle">Agent Runtime</text>

  <!-- Execution Logic box -->
  <rect class="box" x="40" y="75" width="240" height="65" fill="#fff" stroke="#666" stroke-width="1"/>
  <text class="item" x="160" y="100" text-anchor="middle">Execution Logic</text>
  <text class="item" x="160" y="118" text-anchor="middle">(LangGraph / CrewAI)</text>

  <!-- AG-UI Event Emitter box -->
  <rect class="box" x="40" y="160" width="240" height="65" fill="#fff" stroke="#666" stroke-width="1"/>
  <text class="item" x="160" y="185" text-anchor="middle">AG-UI Event Emitter</text>
  <text class="item" x="160" y="203" text-anchor="middle">(typed event stream)</text>

  <!-- Right: UI Application (frontend) -->
  <rect class="box" x="460" y="20" width="300" height="240" fill="#d4edda" stroke="#333" stroke-width="1.5"/>
  <text class="title" x="610" y="42" text-anchor="middle">UI Application (frontend)</text>
  <text class="subtitle" x="610" y="60" text-anchor="middle">AG-UI Event Consumer</text>

  <!-- Event Router + State Store box -->
  <rect class="box" x="480" y="75" width="240" height="65" fill="#fff" stroke="#666" stroke-width="1"/>
  <text class="item" x="600" y="100" text-anchor="middle">Event Router</text>
  <text class="item" x="600" y="118" text-anchor="middle">+ State Store</text>

  <!-- UI Components box -->
  <rect class="box" x="480" y="160" width="240" height="65" fill="#fff" stroke="#666" stroke-width="1"/>
  <text class="item" x="600" y="185" text-anchor="middle">UI Components</text>
  <text class="item" x="600" y="203" text-anchor="middle">(React, Vue, etc.)</text>

  <!-- Arrow: HTTP POST (left → right, upper) -->
  <line x1="280" y1="105" x2="480" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text class="arrow-label" x="380" y="98" text-anchor="middle">HTTP POST</text>

  <!-- Arrow: SSE stream (right → left line, arrowhead at left end pointing right) -->
  <line x1="480" y1="130" x2="280" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text class="arrow-label" x="380" y="148" text-anchor="middle">SSE stream</text>
</svg>
